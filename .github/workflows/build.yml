name: Build PS4 App Dumper

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout App Dumper
        uses: actions/checkout@v4

      - name: Install current Scene Collective PS4 SDK
        run: |
          git clone https://github.com/Scene-Collective/ps4-payload-sdk ~/ps4-payload-sdk
          cd ~/ps4-payload-sdk
          chmod +x install.sh
          sudo ./install.sh

      - name: Build App Dumper
        run: |
          export PS4SDK=/opt/ps4sdk
          make

      - name: Upload compiled payload
        uses: actions/upload-artifact@v4
        with:
          name: ps4-app-dumper-current-sdk
          path: "*.bin"
          if-no-files-found: error
